[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
# Home Assistant runs on Python 3.13; pin it so local and CI ruff agree.
target-version = "py313"
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["B008"]
